<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SoleStock{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">S</span><span>SoleStock</span></a><nav aria-label="Main navigation"><a class="{{ 'active' if request.endpoint=='home' else '' }}" href="{{ url_for('home') }}">Home</a><a class="{{ 'active' if request.endpoint in ['stocks','product_form'] else '' }}" href="{{ url_for('stocks') }}">Stocks</a></nav><a class="button primary desktop-add" href="{{ url_for('product_form') }}">+ Add Product</a></header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Inventory management only · SoleStock</footer><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
