

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login · SoleStock</title>

    <link
        rel="stylesheet"
        href="/style.css?v=3"
    >
</head>

<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <div class="login-brand">
                <span class="brand-mark">S</span>

                <div>
                    <h1>SoleStock</h1>

                    <p>
                        Shoe inventory management
                    </p>
                </div>
            </div>

            <form id="loginForm">
                <label>
                    User ID

                    <input
                        id="userId"
                        type="text"
                        autocomplete="username"
                        required
                    >
                </label>

                <label>
                    Password

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <button
                    id="loginButton"
                    class="button primary"
                    type="submit"
                >
                    Login
                </button>

                <div
                    id="loginError"
                    class="flash error"
                    hidden
                ></div>
            </form>
        </section>
    </main>

    <script>
        const form =
            document.getElementById(
                "loginForm"
            );

        const button =
            document.getElementById(
                "loginButton"
            );

        const errorBox =
            document.getElementById(
                "loginError"
            );

        async function checkSession() {
            const response = await fetch(
                "/api/session",
                {
                    cache: "no-store",
                    credentials: "same-origin",
                }
            );

            const data = await response.json();

            if (data.authenticated) {
                window.location.replace(
                    "/stocks/"
                );
            }
        }

        form.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                errorBox.hidden = true;
                button.disabled = true;
                button.textContent =
                    "Signing in...";

                try {
                    const response = await fetch(
                        "/api/login",
                        {
                            method: "POST",
                            headers: {
                                "content-type":
                                    "application/json",
                            },
                            credentials:
                                "same-origin",
                            body: JSON.stringify({
                                user_id:
                                    document
                                    .getElementById(
                                        "userId"
                                    )
                                    .value,
                                password:
                                    document
                                    .getElementById(
                                        "password"
                                    )
                                    .value,
                            }),
                        }
                    );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error
                            || "Login failed"
                        );
                    }

                    window.location.replace(
                        "/stocks/"
                    );

                } catch (error) {
                    errorBox.textContent =
                        error.message;

                    errorBox.hidden = false;

                } finally {
                    button.disabled = false;
                    button.textContent =
                        "Login";
                }
            }
        );

        checkSession();
    </script>
</body>
</html>
