<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Maharashtra Boot House</title><link rel="stylesheet" href="/style.css?v=90"></head><body class="center"><main class="login-card"><h1>Maharashtra Boot House</h1><p>Shoe inventory management</p><form id="f"><label>User ID<input id="u" required autocomplete="username"></label><label>Password<input id="p" type="password" required autocomplete="current-password"></label><button id="b" class="button primary">Login</button><div id="e" class="error" hidden></div></form></main><script>
const f=document.getElementById('f'),b=document.getElementById('b'),e=document.getElementById('e');
(async()=>{const r=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(d.authenticated)location.replace('/stocks/')})();
f.addEventListener('submit',async x=>{x.preventDefault();e.hidden=true;b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({user_id:document.getElementById('u').value,password:document.getElementById('p').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.replace('/stocks/')}catch(x){e.textContent=x.message;e.hidden=false}finally{b.disabled=false}});
</script></body></html>
